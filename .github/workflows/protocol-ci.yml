name: Protocol CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: protocol-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deterministic-logic:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source and pinned dependencies
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.3.0

      - name: Install Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.13.0
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Build, typecheck, and test deterministic logic
        run: pnpm --filter @cheap/protocol build && pnpm --filter @cheap/protocol typecheck && pnpm --filter @cheap/protocol test && pnpm --filter @cheap/protocol test:runtime

  foundry:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out source and pinned dependencies
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.3.0

      - name: Install Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.13.0
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1
        with:
          version: v1.7.1

      - name: Formatting and compiler lint
        working-directory: contracts
        run: forge fmt --check && forge lint --deny warnings

      - name: Unit, fuzz, and invariant tests
        working-directory: contracts
        run: forge test --force -vv

      - name: Build sizes
        working-directory: contracts
        run: forge build --force --sizes

      - name: Generate Aderyn report
        working-directory: contracts
        run: pnpm security:aderyn

      - name: Retain Aderyn report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: aderyn-report
          path: contracts/aderyn-report.md
          if-no-files-found: error
          retention-days: 30

  slither:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source and pinned dependencies
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.3.0

      - name: Install Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.13.0
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1
        with:
          version: v1.7.1

      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install Slither
        run: |
          python -m venv "$RUNNER_TEMP/slither"
          "$RUNNER_TEMP/slither/bin/python" -m pip install \
            --disable-pip-version-check \
            slither-analyzer==0.11.6

      - name: Prepare isolated analysis workspace
        run: pnpm --dir contracts prepare:analysis

      - name: Compile isolated analysis workspace
        working-directory: contracts/.analysis-workspace
        run: forge build --build-info --force

      - name: Slither analysis
        working-directory: contracts/.analysis-workspace
        run: |
          "$RUNNER_TEMP/slither/bin/slither" . \
            --ignore-compile \
            --fail-high \
            --exclude-dependencies \
            --filter-paths "lib"
