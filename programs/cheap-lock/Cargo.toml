[package]
name = "cheap-lock"
version = "0.1.0"
description = "Non-custodial CHEAP commitment positions with unrestricted principal withdrawal"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "cheap_lock"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
litesvm-tests = [
  "dep:litesvm",
  "dep:solana-account",
  "dep:solana-clock",
  "dep:solana-keypair",
  "dep:solana-message",
  "dep:solana-signer",
  "dep:solana-transaction",
]

[dependencies]
anchor-lang = "=1.1.2"
# Anchor 1.1.2's legacy `token::*` account constraints expand through shared
# token-interface modules. Runtime accounts remain fixed to `Program<Token>` and
# the configured legacy Token program; this feature does not enable Token-2022.
anchor-spl = { version = "=1.1.2", default-features = false, features = ["token", "token_2022"] }
litesvm = { version = "=0.10.0", optional = true }
solana-account = { version = "=3.4.0", optional = true }
solana-clock = { version = "=3.1.0", optional = true }
solana-keypair = { version = "=3.1.2", optional = true }
solana-message = { version = "=3.1.0", optional = true }
solana-security-txt = "=1.1.3"
solana-signer = { version = "=3.0.0", optional = true }
solana-transaction = { version = "=4.3.0", optional = true }

[dev-dependencies]
proptest = "=1.11.0"

[[test]]
name = "cheap_lock_litesvm"
path = "tests/cheap_lock_litesvm.rs"
required-features = ["litesvm-tests"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
  'cfg(target_os, values("solana"))',
  'cfg(feature, values("anchor-debug", "custom-heap", "custom-panic"))',
] }
