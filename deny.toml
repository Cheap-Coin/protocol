[advisories]
yanked = "deny"
unmaintained = "all"
unused-ignored-advisory = "deny"
ignore = [
  { id = "RUSTSEC-2025-0141", reason = "bincode 1.3.3 remains transitive through Anchor 1.1.2, its Solana dependencies, and the feature-gated LiteSVM 0.10 test graph; no compatible patched 1.x release exists, so retain the narrow exception and remove it with the next reviewed upstream migration" },
]

[bans]
multiple-versions = "allow"
wildcards = "deny"

[licenses]
confidence-threshold = 0.8
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "MIT",
  "Unicode-3.0",
  "Zlib",
]
private = { ignore = true }

[sources]
unknown-git = "deny"
unknown-registry = "deny"
