[advisories]
yanked = "deny"
unmaintained = "all"
unused-ignored-advisory = "deny"
ignore = [
  { id = "RUSTSEC-2025-0141", reason = "bincode 1.3.3 is transitive through Anchor 0.32.1; no maintained compatible replacement is available in this graph, so track and remove with the next reviewed Anchor migration" },
]

[bans]
multiple-versions = "allow"
wildcards = "deny"

[licenses]
confidence-threshold = 0.8
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "MIT",
  "Unicode-3.0",
  "Zlib",
]
private = { ignore = true }

[sources]
unknown-git = "deny"
unknown-registry = "deny"
