[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
cache_path = "cache"
libs = ["lib", "../node_modules"]
solc_version = "0.8.28"
optimizer = true
optimizer_runs = 10_000
bytecode_hash = "none"
evm_version = "cancun"
remappings = [
  "@openzeppelin/contracts/=../node_modules/@openzeppelin/contracts/",
  "forge-std/=lib/forge-std/src/"
]

[fuzz]
runs = 1_000

[invariant]
runs = 256
depth = 64
fail_on_revert = true
